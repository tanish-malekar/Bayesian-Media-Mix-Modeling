[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "bayesian-media-mix"
version = "0.1.0"
description = "Bayesian media response and constrained budget scenarios"
requires-python = ">=3.11,<3.14"
dependencies = ["pymc==5.25.1", "pytensor==2.31.7", "arviz==0.22.0", "numpy==2.3.4", "scipy==1.16.3", "pandas==2.3.3", "matplotlib==3.10.7"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[project.scripts]
mmm = "mmm.cli:main"
[tool.setuptools.packages.find]
include = ["mmm*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
